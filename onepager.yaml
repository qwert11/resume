# Что попадает на единственную страницу A4. Факты живут в github.com/qwert11/resume2,
# здесь только отбор: одностраничник показывает вехи, а не историю.
title_key: full
summary_key: full

# Позиции целиком, по порядку, и номера пунктов из experience.yaml, которые считаем вехами.
# Остальные позиции сворачиваются в строку «Раніше».
jobs:
  - id: freelance-ai
    bullets: [0, 3, 5]
  - id: atb
    bullets: [0, 1, 2, 3, 5, 4]
  - id: kjrk
    bullets: [0]

# Цифры под кратким описанием.
max_metrics: 4
metrics: ["10", "2 000+", "33", "15 500"]

# Стек в боковой колонке. Только актуальная версия каждой технологии —
# без «.NET 7 / 6 / 5» и «Delphi 6 → 12»: история версий живёт в полном резюме.
skills:
  - label: {uk: "Бекенд", en: "Backend"}
    items: ["C#", ".NET 7", "ASP.NET Core", "Web API", "EF Core 7", "SignalR"]
  - label: {uk: "Дані", en: "Data"}
    items: ["MS SQL Server", "T-SQL", "PostgreSQL", "Oracle"]
  - label: {uk: "Десктоп", en: "Desktop"}
    items: ["Delphi 12", "Object Pascal", "VCL", "DevExpress", "FastReport"]
  - label: {uk: "Фронтенд", en: "Front end"}
    items: ["Angular 13", "TypeScript", "Kendo UI"]
  - label: {uk: "Доступи", en: "Access"}
    items: ["OpenID Connect", "ADFS", "Kerberos", "Active Directory"]
  - label: {uk: "Інтеграції", en: "Integrations"}
    items: ["Kafka", "EDI", "M.E.Doc", "Oracle EBS", "1С"]
  - label: {uk: "Python та ML", en: "Python and ML"}
    items: ["Python 3.11", "FastAPI", "SQLAlchemy 2", "faster-whisper", "pyannote"]
  - label: {uk: "Постачання", en: "Delivery"}
    items: ["xUnit", "SonarQube", "Jenkins", "Docker", "Git"]
  - label: {uk: "ІІ-агенти", en: "AI agents"}
    items: ["Claude Code", "MCP"]

# Образование: сколько записей показать (дипломы и сертификаты идут в порядке education.yaml).
max_education: 2

full_resume: "https://qwert11.github.io/resume2/"
