profile:
  name: {uk: "Юрій Заїка", en: "Yurii Zaika"}
  location: {uk: "Дніпро, Україна · віддалено або гібрид", en: "Dnipro, Ukraine · remote or hybrid"}
  titles:
    full: {uk: "Провідний інженер ПЗ · .NET та Delphi", en: "Lead Software Engineer · .NET & Delphi"}
    dotnet: {uk: "Senior .NET інженер", en: "Senior .NET Engineer"}
    delphi: {uk: "Senior Delphi інженер · модернізація legacy", en: "Senior Delphi Engineer · Legacy Modernization"}
    web: {uk: "Full Stack інженер · .NET та Angular", en: "Full Stack Engineer · .NET & Angular"}
    ai: {uk: "AI / Python інженер", en: "AI / Python Engineer"}
  summary:
    full:
      uk: "Десять років усередині ядра однієї роздрібної мережі: торгова система на Delphi, якою щодня працюють магазини, і сервіси на ASP.NET Core, що поступово забирають її функції. Доступи для 2000+ користувачів, фіскальні та EDI-інтеграції, міграція клієнта з Delphi 6 на Delphi 12."
      en: "Ten years inside the core systems of one retail network: a Delphi trading platform that stores run on daily, and ASP.NET Core services that keep taking over its functions. Access control for 2,000+ users, fiscal and EDI integrations, and an ongoing Delphi 6 to Delphi 12 client migration."
    dotnet:
      uk: "Senior .NET інженер: ASP.NET Core та Web API на .NET 7, EF Core і T-SQL, інтеграції з Kafka, EDI, M.E.Doc та Oracle EBS, аутентифікація через OIDC, ADFS і Kerberos. Власна система керування доступом на 2000+ користувачів."
      en: "Senior .NET engineer: ASP.NET Core and Web API on .NET 7, EF Core and T-SQL, integrations over Kafka, EDI, M.E.Doc and Oracle EBS, authentication through OIDC, ADFS and Kerberos. Built the in-house access management system used by 2,000+ people."
    delphi:
      uk: "Delphi-інженер із десятирічним досвідом супроводу торгової системи у продакшені: клієнт, якому щодня довіряють магазини мережі, MS SQL, фіскальний контур. Веду міграцію клієнта з Delphi 6 на Delphi 12 і написав інструмент звіряння інтерфейсу та мапінгу БД між версіями."
      en: "Delphi engineer with ten years of production ownership of a retail trading system: the client the network's stores run on daily, MS SQL, the fiscal workflows. Currently migrating the client from Delphi 6 to Delphi 12, with a purpose-built tool that diffs UI and database mappings between the two versions."
    web:
      uk: "Full stack інженер: ASP.NET Core та Web API на бекенді, Angular 13 з Kendo UI і Razor на фронті, real-time через SignalR. Внутрішні системи для роздрібної мережі — доступи, аудит, звітність, інтеграції."
      en: "Full stack engineer: ASP.NET Core and Web API on the back end, Angular 13 with Kendo UI and Razor on the front, real-time over SignalR. Internal systems for a retail network: access control, audit, reporting, integrations."
    ai:
      uk: "Десять років промислової розробки — і власний трек у Python та ML. Побудував голосовий пайплайн реального часу: faster-whisper на CUDA, діаризація pyannote, VAD і потокова обробка, з регресійними замірами затримки та RTF. Поряд — конвеєри даних на SQLAlchemy і Playwright та щоденна робота з ІІ-агентами."
      en: "Ten years of production engineering plus a personal track in Python and ML. Built a real-time speech pipeline: faster-whisper on CUDA, pyannote diarization, VAD and streaming, with regression measurements of latency and RTF. Alongside it: data pipelines on SQLAlchemy and Playwright, and daily work with AI agents."
