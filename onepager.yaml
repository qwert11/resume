# Что попадает на единственную страницу A4. Факты живут в github.com/qwert11/resume2,
# здесь только отбор: одностраничник показывает вехи, а не историю.
#
# Мера: контент занимает половину листа. На профиль — не больше пяти пунктов-вех,
# четыре группы стека по 3–5 пунктов, одна запись об образовании. Всё остальное
# читают в полном резюме по ссылке внизу.
#
# Профили те же, что в полном резюме: full (корень сайта), dotnet, delphi, web, ai.
# У каждого — свой заголовок и описание (ключи из master.yaml), свои позиции с номерами
# пунктов-вех из experience.yaml, свои цифры, свой стек и запись об образовании
# (номер из education.yaml). `note: true` у позиции выводит пометку о работодателе
# (company_note из experience.yaml), например «найбільша продуктова мережа України». Позиции, не попавшие в jobs, сворачиваются в строку «Раніше».
#
# В стеке только актуальная версия каждой технологии — без «.NET 7 / 6 / 5» и
# «Delphi 6 → 12»: история версий живёт в полном резюме.

full_resume: "https://qwert11.github.io/resume2/"

profiles:
  - id: full
    route: ""
    title_key: full
    summary_key: full
    jobs:
      - {id: freelance-ai, bullets: [0]}
      - {id: atb, bullets: [0, 1, 2, 5], note: true}
    metrics: ["10", "2 000+", "33"]
    education: [0]
    skills:
